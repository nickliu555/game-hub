<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hearts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12402C" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/hearts/css/base.css" />
  <link rel="stylesheet" href="/hearts/css/player.css" />
</head>
<body class="player play-page">
  <div class="p-shell">

    <!-- Identity / status bar -->
    <header class="p-top">
      <span class="p-seat" id="pSeat">–</span>
      <span class="p-name pname" id="pName">…</span>
      <span class="p-score" id="pScore"></span>
    </header>

    <!-- Waiting / lobby -->
    <section class="p-view active" id="pv-wait">
      <div class="wait-card">
        <div class="wait-suits" aria-hidden="true">
          <span class="js-red">♥</span><span>♠</span><span class="js-red">♦</span><span>♣</span>
        </div>
        <h2 id="waitTitle">You're in!</h2>
        <p id="waitSub">Waiting for the host to deal…</p>
      </div>
    </section>

    <!-- Passing -->
    <section class="p-view" id="pv-pass">
      <div class="p-banner" id="passBanner">
        Pass <strong id="passDirText">3 cards</strong>
      </div>
      <div class="p-hint" id="passHint">Tap 3 cards to send away</div>
      <div class="hand-area">
        <div class="hand-fan" id="passFan"></div>
      </div>
      <div class="p-actions">
        <button type="button" class="btn-accent action-btn" id="passBtn" disabled>Choose 3 cards</button>
      </div>
    </section>

    <!-- Cards away (waiting on the table) / cards received -->
    <section class="p-view" id="pv-passed">
      <div class="wait-card">
        <div class="wait-check" id="swapIcon">✓</div>
        <h2 id="swapTitle">Cards away</h2>
        <p id="swapSub">Waiting for everyone else to pass…</p>
        <div class="mini-fan" id="swapFan"></div>
      </div>
    </section>

    <!-- Playing -->
    <section class="p-view" id="pv-play">
      <div class="p-meta">
        <span class="meta-chip">Trick <strong id="mTrick">1</strong>/13</span>
        <span class="meta-chip" id="mHearts">♥ not broken</span>
        <span class="meta-chip" id="mPoints">0 this hand</span>
      </div>
      <div class="p-banner" id="playBanner">Waiting…</div>
      <div class="p-hint" id="playHint"></div>
      <div class="hand-area">
        <div class="hand-fan" id="playFan"></div>
      </div>
      <div class="p-actions">
        <button type="button" class="btn-accent action-btn" id="playBtn" disabled>Tap a card</button>
      </div>
    </section>

    <!-- Hand over / game over -->
    <section class="p-view" id="pv-result">
      <div class="wait-card scrollable-region">
        <div class="result-emoji" id="resultEmoji">♥️</div>
        <h2 id="resultTitle">Hand over</h2>
        <p id="resultSub"></p>
        <div class="result-rows" id="resultRows"></div>
      </div>
    </section>

    <div class="reaction-bar" id="reactionBar" hidden>
      <button type="button" class="reaction-btn" data-reaction="0" aria-label="laugh">😂</button>
      <button type="button" class="reaction-btn" data-reaction="1" aria-label="fire">🔥</button>
      <button type="button" class="reaction-btn" data-reaction="2" aria-label="party">🎉</button>
      <button type="button" class="reaction-btn" data-reaction="3" aria-label="shock">😱</button>
      <button type="button" class="reaction-btn" data-reaction="4" aria-label="cry">😭</button>
      <button type="button" class="reaction-btn" data-reaction="5" aria-label="angry">😡</button>
      <div class="reaction-cooldown" id="reactionCooldown" hidden></div>
    </div>

    <div class="player-attribution" id="playerAttribution" hidden>Developed by Nick Liu (with help from Claude)</div>

  </div>

  <div class="p-toast" id="pToast" hidden></div>

  <div class="host-absent-overlay" id="pConnOverlay" hidden>
    <div class="host-absent-card">
      <div class="icon">♥️</div>
      <div class="title">Reconnecting…</div>
      <div class="sub"><span class="pulse-dot"></span>Your seat and your hand are safe.</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/hearts/js/player.js"></script>
</body>
</html>
