<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#087765">
  <script src="/stackingroyale/js/controls.js?v=2"></script>
  <title>Stacking Royale · Solo Practice</title>
  <script src="/shared/iris-preload.js"></script>
  <link rel="stylesheet" href="/shared/iris.css">
  <script src="/shared/iris.js" defer></script>
  <link rel="stylesheet" href="/stackingroyale/css/base.css">
  <link rel="stylesheet" href="/stackingroyale/css/player.css">
  <link rel="stylesheet" href="/stackingroyale/css/touch.css?v=2">
  <script src="/stackingroyale/vendor/lucide.js" defer></script>
  <script src="/stackingroyale/js/engine.bundle.js" defer></script>
  <script src="/stackingroyale/js/render.js" defer></script>
  <script src="/stackingroyale/js/common.js" defer></script>
  <script src="/stackingroyale/js/practice.js" defer></script>
</head>
<body class="player practice" data-role="practice">
  <div class="player-shell">
    <main>
      <div class="session-heading"><div><div class="eyebrow">Classic endless</div><h1>Solo practice</h1></div><div id="sessionTools" class="session-tools"></div></div>
      <div id="confirmStrip" class="confirm-strip" hidden><span id="confirmText"></span><button id="cancelConfirm" class="secondary">Cancel</button></div>
      <div id="practiceNotice" class="status-message error" role="status" hidden></div>
      <section id="playSurface" aria-label="Practice board"></section>
      <section id="results" class="results" hidden><div class="eyebrow">Session complete</div><h2>Keep building.</h2><p id="resultSummary"></p><button id="againBtn" class="primary">Play again</button></section>
    </main>
  </div>
</body>
</html>
